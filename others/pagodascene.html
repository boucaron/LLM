<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peaceful Pagoda</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-family: 'Georgia', serif;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="info">✦ A peaceful morning at the temple ✦</div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ─── Scene Setup ───
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7EC8E3);
        scene.fog = new THREE.FogExp2(0xA8D8EA, 0.007);

        const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
        camera.position.set(18, 12, 24);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 6, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.05;
        controls.minDistance = 8;
        controls.maxDistance = 80;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;

        // ─── Lighting ───
        const ambient = new THREE.AmbientLight(0xFFF8E7, 0.5);
        scene.add(ambient);

        const sun = new THREE.DirectionalLight(0xFFF2D9, 1.8);
        sun.position.set(25, 40, 15);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 100;
        sun.shadow.camera.left = -40;
        sun.shadow.camera.right = 40;
        sun.shadow.camera.top = 40;
        sun.shadow.camera.bottom = -40;
        sun.shadow.bias = -0.001;
        scene.add(sun);

        const hemi = new THREE.HemisphereLight(0x87CEEB, 0x2d5a27, 0.4);
        scene.add(hemi);

        // ─── Ground ───
        const groundGeo = new THREE.CircleGeometry(100, 64);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x4E8B3A, roughness: 0.95 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Slight color variation patches on ground
        for (let i = 0; i < 40; i++) {
            const a = Math.random() * Math.PI * 2;
            const d = Math.random() * 60;
            const pGeo = new THREE.CircleGeometry(1 + Math.random() * 2, 8);
            const pMat = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(0.3 + Math.random() * 0.05, 0.5, 0.3 + Math.random() * 0.1),
                roughness: 1
            });
            const patch = new THREE.Mesh(pGeo, pMat);
            patch.rotation.x = -Math.PI / 2;
            patch.position.set(Math.cos(a) * d, 0.01, Math.sin(a) * d);
            scene.add(patch);
        }

        // ─── Pagoda ───
        function buildPagoda() {
            const g = new THREE.Group();

            const woodMat = new THREE.MeshStandardMaterial({ color: 0x6B3A2A, roughness: 0.7 });
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xE8D5B7, roughness: 0.85 });
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x2C3E50, roughness: 0.4, metalness: 0.2 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.9, roughness: 0.1 });
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x5C3317, roughness: 0.9 });

            // Stone base
            const baseGeo = new THREE.CylinderGeometry(6, 6.5, 1.2, 8);
            const base = new THREE.Mesh(baseGeo, new THREE.MeshStandardMaterial({ color: 0x7A7A7A, roughness: 0.9 }));
            base.position.y = 0.6;
            base.castShadow = true;
            base.receiveShadow = true;
            g.add(base);

            // Steps
            for (let s = 0; s < 3; s++) {
                const stepGeo = new THREE.BoxGeometry(3 - s * 0.4, 0.25, 1);
                const step = new THREE.Mesh(stepGeo, new THREE.MeshStandardMaterial({ color: 0x888888 }));
                step.position.set(0, 0.12 + s * 0.25, 7 + s * 0.5);
                step.castShadow = true;
                step.receiveShadow = true;
                g.add(step);
            }

            // Tiers
            const tiers = 5;
            for (let i = 0; i < tiers; i++) {
                const scale = 1 - i * 0.14;
                const bodyH = 2.2;
                const roofH = 1.4;
                const gap = 0.2;
                const baseY = 1.2 + i * (bodyH + roofH + gap);

                // Body
                const bodyGeo = new THREE.CylinderGeometry(
                    2.2 * scale * 0.85, 2.2 * scale, bodyH, 8
                );
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = baseY + bodyH / 2;
                body.castShadow = true;
                body.receiveShadow = true;
                g.add(body);

                // Pillars
                for (let p = 0; p < 4; p++) {
                    const angle = (p / 4) * Math.PI * 2 + Math.PI / 4;
                    const pGeo = new THREE.CylinderGeometry(0.12 * scale, 0.12 * scale, bodyH, 6);
                    const pillar = new THREE.Mesh(pGeo, woodMat);
                    pillar.position.set(
                        Math.cos(angle) * 2.0 * scale,
                        baseY + bodyH / 2,
                        Math.sin(angle) * 2.0 * scale
                    );
                    pillar.castShadow = true;
                    g.add(pillar);
                }

                // Door
                const doorGeo = new THREE.BoxGeometry(0.8 * scale, 1.2 * scale, 0.1);
                const door = new THREE.Mesh(doorGeo, doorMat);
                door.position.set(0, baseY + 0.6 * scale, 2.1 * scale);
                g.add(door);

                // Windows
                for (let w = 0; w < 3; w++) {
                    const wAngle = (w / 3) * Math.PI + Math.PI * 0.5;
                    const winGeo = new THREE.PlaneGeometry(0.5 * scale, 0.7 * scale);
                    const winMat = new THREE.MeshStandardMaterial({
                        color: 0xFFE4B5, emissive: 0xFFAA44, emissiveIntensity: 0.3, side: THREE.DoubleSide
                    });
                    const win = new THREE.Mesh(winGeo, winMat);
                    win.position.set(
                        Math.cos(wAngle) * 2.1 * scale,
                        baseY + bodyH / 2,
                        Math.sin(wAngle) * 2.1 * scale
                    );
                    win.lookAt(0, baseY + bodyH / 2, 0);
                    g.add(win);
                }

                // Eave ring
                const eaveGeo = new THREE.CylinderGeometry(3.8 * scale, 4.2 * scale, 0.18, 8);
                const eave = new THREE.Mesh(eaveGeo, roofMat);
                eave.position.y = baseY + bodyH + 0.09;
                eave.castShadow = true;
                g.add(eave);

                // Roof (upturned cone)
                const roofGeo = new THREE.ConeGeometry(3.8 * scale, roofH, 8);
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.y = baseY + bodyH + 0.18 + roofH / 2;
                roof.castShadow = true;
                g.add(roof);

                // Small decorative finial on each roof
                const finGeo = new THREE.SphereGeometry(0.15 * scale, 8, 8);
                const fin = new THREE.Mesh(finGeo, goldMat);
                fin.position.y = baseY + bodyH + 0.18 + roofH + 0.1;
                g.add(fin);
            }

            // Spire
            const totalH = 1.2 + tiers * (2.2 + 1.4 + 0.2);
            const spireGeo = new THREE.CylinderGeometry(0.06, 0.12, 2.5, 8);
            const spire = new THREE.Mesh(spireGeo, goldMat);
            spire.position.y = totalH + 1.25;
            spire.castShadow = true;
            g.add(spire);

            // Top orb
            const orbGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const orb = new THREE.Mesh(orbGeo, goldMat);
            orb.position.y = totalH + 2.8;
            orb.castShadow = true;
            g.add(orb);

            return { group: g, totalHeight: totalH };
        }

        const pagoda = buildPagoda();
        scene.add(pagoda.group);

        // ─── Trees ───
        const trees = [];

        function makeTree(x, z, scale, cherry) {
            const t = new THREE.Group();
            const trunkH = 2.5 * scale;

            // Trunk
            const trunkGeo = new THREE.CylinderGeometry(0.12 * scale, 0.22 * scale, trunkH, 7);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5D4037, roughness: 0.95 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = trunkH / 2;
            trunk.castShadow = true;
            t.add(trunk);

            // Canopy - organic blob shape
            const canopyBase = cherry ? 0xFFB4C8 : 0x3B8C4A;
            const canopyMat = new THREE.MeshStandardMaterial({
                color: canopyBase, roughness: 0.85,
                transparent: true, opacity: cherry ? 0.92 : 1.0
            });

            const blobs = [
                { r: 1.6, pos: [0, 0.3, 0] },
                { r: 1.3, pos: [0.9, 0, 0.5] },
                { r: 1.1, pos: [-0.8, -0.2, -0.4] },
                { r: 1.0, pos: [0.3, -0.4, -0.8] },
                { r: 0.8, pos: [-0.5, 0.5, 0.6] }
            ];

            blobs.forEach(b => {
                const sGeo = new THREE.SphereGeometry(b.r * scale, 10, 10);
                const s = new THREE.Mesh(sGeo, canopyMat);
                s.position.set(b.pos[0] * scale, trunkH + b.pos[1] * scale, b.pos[2] * scale);
                s.castShadow = true;
                t.add(s);
            });

            t.position.set(x, 0, z);
            t.userData.swayOffset = Math.random() * Math.PI * 2;
            t.userData.swaySpeed = 0.3 + Math.random() * 0.3;
            trees.push(t);
            return t;
        }

        // Tree placement - artistic arrangement
        const treeData = [
            { x: 14, z: 10, s: 1.3, c: true },
            { x: -16, z: 6, s: 1.1, c: false },
            { x: 12, z: -14, s: 1.2, c: true },
            { x: -12, z: -12, s: 1.4, c: false },
            { x: 20, z: -6, s: 1.0, c: true },
            { x: -20, z: -10, s: 1.1, c: false },
            { x: 18, z: 16, s: 1.1, c: false },
            { x: -18, z: 14, s: 1.2, c: true },
            { x: 26, z: 4, s: 0.9, c: false },
            { x: -26, z: 4, s: 1.0, c: true },
            { x: 10, z: -22, s: 1.0, c: false },
            { x: -10, z: -22, s: 1.1, c: true },
            { x: 32, z: -12, s: 1.2, c: false },
            { x: -32, z: -12, s: 1.1, c: true },
            { x: 28, z: 22, s: 1.1, c: false },
            { x: -28, z: 22, s: 1.0, c: true },
            { x: 38, z: 0, s: 1.3, c: false },
            { x: -38, z: 0, s: 1.2, c: true },
            { x: 35, z: 30, s: 1.0, c: false },
            { x: -35, z: 30, s: 1.1, c: true },
            { x: 42, z: -20, s: 1.0, c: false },
            { x: -42, z: -20, s: 0.9, c: true },
            { x: 40, z: 20, s: 1.1, c: false },
            { x: -40, z: 20, s: 1.0, c: true },
        ];

        treeData.forEach(td => {
            scene.add(makeTree(td.x, td.z, td.s, td.c));
        });

        // ─── Stepping Stone Path ───
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.95 });
        for (let i = 0; i < 10; i++) {
            const sGeo = new THREE.CylinderGeometry(0.35 + Math.random() * 0.1, 0.4 + Math.random() * 0.1, 0.12, 6);
            const stone = new THREE.Mesh(sGeo, stoneMat);
            const z = 5 + i * 1.4;
            stone.position.set((i % 2 === 0 ? 0.3 : -0.3) + (Math.random() - 0.5) * 0.3, 0.06, z);
            stone.rotation.y = Math.random() * Math.PI;
            stone.castShadow = true;
            stone.receiveShadow = true;
            scene.add(stone);
        }

        // ─── Pond ───
        const pondGroup = new THREE.Group();
        const waterGeo = new THREE.CircleGeometry(4.5, 32);
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x3A7CA5, roughness: 0.05, metalness: 0.4,
            transparent: true, opacity: 0.75
        });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        water.position.y = 0.03;
        pondGroup.add(water);

        // Pond rim rocks
        for (let i = 0; i < 14; i++) {
            const angle = (i / 14) * Math.PI * 2;
            const rGeo = new THREE.SphereGeometry(0.25 + Math.random() * 0.25, 7, 7);
            const rMat = new THREE.MeshStandardMaterial({ color: 0x6B6B6B, roughness: 0.9 });
            const rock = new THREE.Mesh(rGeo, rMat);
            rock.position.set(Math.cos(angle) * 4.8, 0.12, Math.sin(angle) * 4.8);
            rock.scale.y = 0.5;
            rock.rotation.y = Math.random() * Math.PI;
            rock.castShadow = true;
            pondGroup.add(rock);
        }
        pondGroup.position.set(14, 0, 4);
        scene.add(pondGroup);

        // Koi fish (simple colored shapes in water)
        for (let i = 0; i < 4; i++) {
            const koiGeo = new THREE.CapsuleGeometry(0.15, 0.4, 4, 8);
            const koiMat = new THREE.MeshStandardMaterial({
                color: i % 2 === 0 ? 0xFF6633 : 0xFFAA00, roughness: 0.5
            });
            const koi = new THREE.Mesh(koiGeo, koiMat);
            koi.position.set(
                14 + (Math.random() - 0.5) * 6,
                0.1,
                4 + (Math.random() - 0.5) * 6
            );
            koi.rotation.x = Math.PI / 2;
            koi.userData.swimAngle = Math.random() * Math.PI * 2;
            koi.userData.swimSpeed = 0.3 + Math.random() * 0.3;
            koi.userData.swimRadius = 1.5 + Math.random() * 2;
            scene.add(koi);
        }

        // ─── Torii Gate ───
        function makeToriiGate(x, z) {
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xCC2222, roughness: 0.6 });

            // Posts
            const postGeo = new THREE.CylinderGeometry(0.3, 0.35, 5, 8);
            const p1 = new THREE.Mesh(postGeo, mat);
            p1.position.set(-2, 2.5, 0);
            p1.castShadow = true;
            g.add(p1);
            const p2 = new THREE.Mesh(postGeo, mat);
            p2.position.set(2, 2.5, 0);
            p2.castShadow = true;
            g.add(p2);

            // Top beam
            const beamGeo = new THREE.BoxGeometry(5.5, 0.3, 0.3);
            const beam = new THREE.Mesh(beamGeo, mat);
            beam.position.y = 5.1;
            beam.castShadow = true;
            g.add(beam);

            // Curved top (simplified)
            const curveGeo = new THREE.BoxGeometry(6, 0.25, 0.25);
            const curve = new THREE.Mesh(curveGeo, mat);
            curve.position.y = 5.5;
            curve.rotation.z = 0.05;
            curve.castShadow = true;
            g.add(curve);

            // Middle beam
            const midGeo = new THREE.BoxGeometry(4.5, 0.2, 0.2);
            const mid = new THREE.Mesh(midGeo, mat);
            mid.position.y = 3.8;
            mid.castShadow = true;
            g.add(mid);

            g.position.set(x, 0, z);
            return g;
        }
        scene.add(makeToriiGate(0, 12));

        // ─── Stone Lanterns ───
        function makeLantern(x, z) {
            const g = new THREE.Group();
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x8A8A8A, roughness: 0.9 });
            const glowMat = new THREE.MeshStandardMaterial({
                color: 0xFFEECC, emissive: 0xFFAA33, emissiveIntensity: 0.8
            });

            // Base
            const baseG = new THREE.CylinderGeometry(0.4, 0.5, 0.3, 6);
            const base = new THREE.Mesh(baseG, stoneMat);
            base.position.y = 0.15;
            base.castShadow = true;
            g.add(base);

            // Post
            const postG = new THREE.CylinderGeometry(0.12, 0.12, 1.2, 6);
            const post = new THREE.Mesh(postG, stoneMat);
            post.position.y = 0.9;
            post.castShadow = true;
            g.add(post);

            // Light chamber
            const chamG = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const cham = new THREE.Mesh(chamG, glowMat);
            cham.position.y = 1.7;
            cham.castShadow = true;
            g.add(cham);

            // Roof
            const roofG = new THREE.ConeGeometry(0.5, 0.35, 4);
            const roof = new THREE.Mesh(roofG, stoneMat);
            roof.position.y = 2.15;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            g.add(roof);

            // Top ornament
            const topG = new THREE.SphereGeometry(0.1, 8, 8);
            const top = new THREE.Mesh(topG, stoneMat);
            top.position.y = 2.4;
            g.add(top);

            // Point light
            const pl = new THREE.PointLight(0xFFAA44, 0.8, 6);
            pl.position.y = 1.7;
            g.add(pl);

            g.position.set(x, 0, z);
            return g;
        }

        scene.add(makeLantern(4, 9));
        scene.add(makeLantern(-4, 9));
        scene.add(makeLantern(8, 14));
        scene.add(makeLantern(-8, 14));

        // ─── Scattered Rocks ───
        for (let i = 0; i < 20; i++) {
            const a = Math.random() * Math.PI * 2;
            const d = 12 + Math.random() * 35;
            const rGeo = new THREE.DodecahedronGeometry(0.2 + Math.random() * 0.5, 0);
            const rMat = new THREE.MeshStandardMaterial({ color: 0x707070, roughness: 0.95 });
            const rock = new THREE.Mesh(rGeo, rMat);
            rock.position.set(Math.cos(a) * d, 0.15, Math.sin(a) * d);
            rock.rotation.set(Math.random(), Math.random(), 0);
            rock.scale.y = 0.6 + Math.random() * 0.3;
            rock.castShadow = true;
            rock.receiveShadow = true;
            scene.add(rock);
        }

        // ─── Grass Blades ───
        const grassGeo = new THREE.ConeGeometry(0.04, 0.4, 4);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x3D7A2E });
        for (let i = 0; i < 80; i++) {
            const a = Math.random() * Math.PI * 2;
            const d = 6 + Math.random() * 40;
            const blade = new THREE.Mesh(grassGeo, grassMat);
            blade.position.set(Math.cos(a) * d, 0.2, Math.sin(a) * d);
            blade.rotation.z = (Math.random() - 0.5) * 0.4;
            scene.add(blade);
        }

        // ─── Flowers ───
        const flowerColors = [0xFF6B6B, 0xFFD93D, 0xFF8EDE, 0xFFFFFF, 0xFF9F43];
        for (let i = 0; i < 25; i++) {
            const a = Math.random() * Math.PI * 2;
            const d = 8 + Math.random() * 30;
            const fGeo = new THREE.SphereGeometry(0.12, 6, 6);
            const fMat = new THREE.MeshStandardMaterial({
                color: flowerColors[Math.floor(Math.random() * flowerColors.length)],
                roughness: 0.7
            });
            const flower = new THREE.Mesh(fGeo, fMat);
            flower.position.set(Math.cos(a) * d, 0.15, Math.sin(a) * d);
            scene.add(flower);
        }

        // ─── Floating Particles (pollen / light motes) ───
        const P_COUNT = 300;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(P_COUNT * 3);
        const pVel = new Float32Array(P_COUNT * 3);
        const pPhase = new Float32Array(P_COUNT);

        for (let i = 0; i < P_COUNT; i++) {
            pPos[i * 3] = (Math.random() - 0.5) * 60;
            pPos[i * 3 + 1] = Math.random() * 14 + 0.5;
            pPos[i * 3 + 2] = (Math.random() - 0.5) * 60;
            pVel[i * 3] = (Math.random() - 0.5) * 0.005;
            pVel[i * 3 + 1] = 0.003 + Math.random() * 0.008;
            pVel[i * 3 + 2] = (Math.random() - 0.5) * 0.005;
            pPhase[i] = Math.random() * Math.PI * 2;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));

        const pMat = new THREE.PointsMaterial({
            color: 0xFFF8D0, size: 0.08, transparent: true, opacity: 0.5,
            blending: THREE.AdditiveBlending, depthWrite: false
        });
        scene.add(new THREE.Points(pGeo, pMat));

        // ─── Cherry Blossom Petals ───
        const PETAL_COUNT = 150;
        const petalGeo = new THREE.BufferGeometry();
        const petalPos = new Float32Array(PETAL_COUNT * 3);
        const petalVel = new Float32Array(PETAL_COUNT * 3);

        for (let i = 0; i < PETAL_COUNT; i++) {
            petalPos[i * 3] = (Math.random() - 0.5) * 40;
            petalPos[i * 3 + 1] = Math.random() * 12 + 3;
            petalPos[i * 3 + 2] = (Math.random() - 0.5) * 40;
            petalVel[i * 3] = (Math.random() - 0.5) * 0.03;
            petalVel[i * 3 + 1] = -(0.008 + Math.random() * 0.015);
            petalVel[i * 3 + 2] = (Math.random() - 0.5) * 0.03;
        }
        petalGeo.setAttribute('position', new THREE.BufferAttribute(petalPos, 3));

        const petalMat = new THREE.PointsMaterial({
            color: 0xFFB4C8, size: 0.18, transparent: true, opacity: 0.85
        });
        scene.add(new THREE.Points(petalGeo, petalMat));

        // ─── Clouds ───
        const clouds = [];
        function makeCloud(x, y, z) {
            const cg = new THREE.Group();
            const cm = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 1, transparent: true, opacity: 0.85 });
            const puffs = [
                [0, 0, 0, 2.5], [2.5, 0.4, 0.5, 1.8], [-2, -0.2, 0.3, 1.5],
                [4, -0.1, -0.4, 2.0], [-3.5, 0.3, -0.2, 1.4], [1, 0.6, 0, 1.2]
            ];
            puffs.forEach(p => {
                const sg = new THREE.SphereGeometry(p[3], 10, 10);
                const s = new THREE.Mesh(sg, cm);
                s.position.set(p[0], p[1], p[2]);
                s.scale.y = 0.45;
                cg.add(s);
            });
            cg.position.set(x, y, z);
            clouds.push(cg);
            return cg;
        }

        for (let i = 0; i < 6; i++) {
            scene.add(makeCloud(
                (Math.random() - 0.5) * 100,
                30 + Math.random() * 15,
                (Math.random() - 0.5) * 100
            ));
        }

        // ─── Butterflies ───
        const butterflies = [];
        function makeButterfly() {
            const bg = new THREE.Group();
            const wingMat = new THREE.MeshStandardMaterial({
                color: 0xFF6699, side: THREE.DoubleSide, roughness: 0.6
            });
            const wingGeo = new THREE.PlaneGeometry(0.3, 0.4);

            const w1 = new THREE.Mesh(wingGeo, wingMat);
            w1.position.x = -0.15;
            w1.name = 'wingL';
            bg.add(w1);

            const w2 = new THREE.Mesh(wingGeo, wingMat);
            w2.position.x = 0.15;
            w2.name = 'wingR';
            bg.add(w2);

            bg.userData.phase = Math.random() * Math.PI * 2;
            bg.userData.speed = 0.5 + Math.random() * 0.5;
            bg.userData.radius = 3 + Math.random() * 4;
            bg.userData.center = new THREE.Vector3(
                (Math.random() - 0.5) * 20,
                3 + Math.random() * 4,
                (Math.random() - 0.5) * 20
            );
            butterflies.push(bg);
            return bg;
        }

        for (let i = 0; i < 5; i++) scene.add(makeButterfly());

        // ─── Animation Loop ───
        const clock = new THREE.Clock();
        const kois = scene.children.filter(c => c.userData.swimAngle !== undefined);

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // Pollen particles
            for (let i = 0; i < P_COUNT; i++) {
                pPos[i * 3] += pVel[i * 3] + Math.sin(t * 0.5 + pPhase[i]) * 0.003;
                pPos[i * 3 + 1] += pVel[i * 3 + 1];
                pPos[i * 3 + 2] += pVel[i * 3 + 2] + Math.cos(t * 0.5 + pPhase[i]) * 0.003;
                if (pPos[i * 3 + 1] > 15) pPos[i * 3 + 1] = 0.5;
            }
            pGeo.attributes.position.needsUpdate = true;

            // Petals
            for (let i = 0; i < PETAL_COUNT; i++) {
                petalPos[i * 3] += petalVel[i * 3] + Math.sin(t * 2 + i * 0.7) * 0.015;
                petalPos[i * 3 + 1] += petalVel[i * 3 + 1];
                petalPos[i * 3 + 2] += petalVel[i * 3 + 2] + Math.cos(t * 2 + i * 0.7) * 0.015;
                if (petalPos[i * 3 + 1] < 0.1) {
                    petalPos[i * 3 + 1] = 10 + Math.random() * 5;
                    petalPos[i * 3] = (Math.random() - 0.5) * 40;
                    petalPos[i * 3 + 2] = (Math.random() - 0.5) * 40;
                }
            }
            petalGeo.attributes.position.needsUpdate = true;

            // Tree sway
            trees.forEach(tree => {
                const o = tree.userData.swayOffset;
                const s = tree.userData.swaySpeed;
                tree.rotation.z = Math.sin(t * s + o) * 0.015;
                tree.rotation.x = Math.cos(t * s * 0.7 + o) * 0.01;
            });

            // Cloud drift
            clouds.forEach(c => {
                c.position.x += 0.008;
                if (c.position.x > 60) c.position.x = -60;
            });

            // Koi swimming
            kois.forEach(koi => {
                const a = koi.userData.swimAngle + t * koi.userData.swimSpeed;
                const r = koi.userData.swimRadius;
                koi.position.x = 14 + Math.cos(a) * r;
                koi.position.z = 4 + Math.sin(a) * r;
                koi.rotation.y = -a + Math.PI / 2;
            });

            // Butterflies
            butterflies.forEach(b => {
                const a = t * b.userData.speed + b.userData.phase;
                const r = b.userData.radius;
                const c = b.userData.center;
                b.position.x = c.x + Math.cos(a) * r;
                b.position.y = c.y + Math.sin(t * 2 + b.userData.phase) * 0.5;
                b.position.z = c.z + Math.sin(a) * r;
                b.rotation.y = -a + Math.PI / 2;

                // Wing flap
                const flap = Math.sin(t * 12 + b.userData.phase) * 0.5;
                b.children[0].rotation.y = flap;
                b.children[1].rotation.y = -flap;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // ─── Resize ───
        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>
