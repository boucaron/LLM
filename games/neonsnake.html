<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON SNAKE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }

  .scanlines::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.15) 2px,
      rgba(0, 0, 0, 0.15) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  .game-wrapper {
    position: relative;
    padding: 20px;
    border: 2px solid #0ff;
    box-shadow:
      0 0 10px #0ff,
      0 0 40px #0ff4,
      inset 0 0 20px #0ff2;
    border-radius: 4px;
  }

  h1 {
    color: #f0f;
    text-align: center;
    font-size: 1.8rem;
    letter-spacing: 8px;
    text-shadow:
      0 0 5px #f0f,
      0 0 15px #f0f,
      0 0 40px #f0f;
    margin-bottom: 12px;
    font-weight: bold;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
    margin-bottom: 8px;
  }

  .score {
    color: #0f0;
    font-size: 1rem;
    text-shadow: 0 0 5px #0f0, 0 0 15px #0f0;
  }

  .speed {
    color: #ff0;
    font-size: 0.8rem;
    text-shadow: 0 0 5px #ff0, 0 0 10px #ff0;
  }

  canvas {
    display: block;
    background: #050505;
    border: 1px solid #333;
  }

  .msg {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    background: rgba(5, 5, 5, 0.85);
    z-index: 10;
  }

  .msg.hidden { display: none; }

  .msg p {
    color: #0ff;
    font-size: 1.2rem;
    letter-spacing: 3px;
    text-shadow: 0 0 8px #0ff, 0 0 20px #0ff;
    animation: pulse 1.2s ease-in-out infinite;
  }

  .msg .gameover {
    color: #f00;
    text-shadow: 0 0 8px #f00, 0 0 20px #f00;
    animation: none;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body class="scanlines">

<div class="game-wrapper">
  <h1>NEON SNAKE</h1>
  <div class="hud">
    <span class="score">SCORE: <span id="score">0</span></span>
    <span class="speed">SPEED: <span id="speed">1</span>x</span>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="msg" id="msg">
    <p id="msgText">PRESS ENTER TO START</p>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');
const msgText = document.getElementById('msgText');
const scoreEl = document.getElementById('score');
const speedEl = document.getElementById('speed');

const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake, dir, nextDir, food, score, speed, gameLoop, playing;

function reset() {
  const cx = Math.floor(COLS / 2);
  const cy = Math.floor(ROWS / 2);
  snake = [
    { x: cx, y: cy },
    { x: cx - 1, y: cy },
    { x: cx - 2, y: cy }
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  speed = 1;
  spawnFood();
  scoreEl.textContent = '0';
  speedEl.textContent = '1';
}

function spawnFood() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
  // self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    speed = 1 + Math.floor(score / 50) * 0.2;
    speedEl.textContent = speed.toFixed(1);
    spawnFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // grid
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * GRID, 0);
    ctx.lineTo(i * GRID, canvas.height);
    ctx.stroke();
  }
  for (let i = 0; i <= ROWS; i++) {
    ctx.beginPath();
    ctx.moveTo(0, i * GRID);
    ctx.lineTo(canvas.width, i * GRID);
    ctx.stroke();
  }

  // food
  ctx.shadowColor = '#f0f';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#f0f';
  ctx.fillRect(food.x * GRID + 3, food.y * GRID + 3, GRID - 6, GRID - 6);

  // snake
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 10;
  snake.forEach((seg, i) => {
    const t = i / snake.length;
    ctx.fillStyle = i === 0 ? '#0ff' : `rgba(0, 255, ${Math.floor(255 * (1 - t * 0.6))}, ${1 - t * 0.5})`;
    ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
  });

  ctx.shadowBlur = 0;
}

function gameOver() {
  playing = false;
  clearInterval(gameLoop);
  msg.classList.remove('hidden');
  msgText.textContent = 'GAME OVER — PRESS ENTER';
  msgText.className = 'gameover';
}

function start() {
  reset();
  msg.classList.add('hidden');
  msgText.className = '';
  playing = true;
  draw();
  gameLoop = setInterval(tick, 1000 / speed / 6);
}

function restart() {
  clearInterval(gameLoop);
  start();
}

// adjust interval dynamically
function tick2() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
  if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    speed = 1 + Math.floor(score / 50) * 0.2;
    speedEl.textContent = speed.toFixed(1);
    spawnFood();
    clearInterval(gameLoop);
    gameLoop = setInterval(tick2, 1000 / speed / 6);
  } else {
    snake.pop();
  }
  draw();
}

// Override start to use tick2
function startGame() {
  reset();
  msg.classList.add('hidden');
  msgText.className = '';
  playing = true;
  draw();
  gameLoop = setInterval(tick2, 1000 / speed / 6);
}

document.addEventListener('keydown', e => {
  const k = e.key;

  if (k === 'Enter') {
    if (!playing) startGame();
    return;
  }

  if (!playing) return;

  switch (k) {
    case 'ArrowUp': case 'w': case 'W':
      if (dir.y !== 1) nextDir = { x: 0, y: -1 }; break;
    case 'ArrowDown': case 's': case 'S':
      if (dir.y !== -1) nextDir = { x: 0, y: 1 }; break;
    case 'ArrowLeft': case 'a': case 'A':
      if (dir.x !== 1) nextDir = { x: -1, y: 0 }; break;
    case 'ArrowRight': case 'd': case 'D':
      if (dir.x !== -1) nextDir = { x: 1, y: 0 }; break;
  }
});

// initial state
reset();
draw();
</script>
</body>
</html>
