<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON BREAK</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
}
#game-container {
  position: relative;
  border: 2px solid #ff00ff;
  box-shadow: 0 0 20px #ff00ff, 0 0 60px #ff00ff33, inset 0 0 20px #ff00ff11;
  border-radius: 4px;
}
canvas {
  display: block;
  background: #0a0a0f;
}
#overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(10,10,15,0.85);
  pointer-events: all;
}
#overlay h1 {
  color: #00ffff;
  font-size: 48px;
  text-shadow: 0 0 10px #00ffff, 0 0 40px #00ffff;
  margin-bottom: 10px;
  letter-spacing: 4px;
}
#overlay p {
  color: #ff00ff;
  font-size: 18px;
  text-shadow: 0 0 8px #ff00ff;
  margin: 8px 0;
}
#overlay .start {
  color: #00ff00;
  font-size: 22px;
  text-shadow: 0 0 10px #00ff00;
  margin-top: 30px;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="canvas" width="700" height="500"></canvas>
  <div id="overlay">
    <h1>NEON BREAK</h1>
    <p>ARROW KEYS / MOUSE to move paddle</p>
    <p>SPACE to launch ball</p>
    <p class="start">▶ PRESS SPACE TO START ◀</p>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const W = canvas.width, H = canvas.height;

const COLORS = ['#ff00ff', '#00ffff', '#00ff00', '#ff6600', '#ffff00', '#ff0066', '#9900ff'];

let state = 'menu'; // menu, playing, gameover, win
let score = 0, lives = 3, level = 1;
let paddle, ball, blocks, particles;
let keys = {};

function resetBall() {
  ball = { x: W/2, y: H - 60, dx: 0, dy: 0, r: 7, speed: 5.5 + level * 0.4, launched: false };
}

function createBlocks() {
  blocks = [];
  const rows = 6, cols = 10, bw = 60, bh = 22, gap = 4;
  const offX = (W - (cols*(bw+gap) - gap)) / 2;
  const offY = 60;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      blocks.push({
        x: offX + c*(bw+gap),
        y: offY + r*(bh+gap),
        w: bw, h: bh,
        color: COLORS[r % COLORS.length],
        alive: true,
        hp: r < 2 ? 2 : 1
      });
    }
  }
}

function init() {
  score = 0; lives = 3; level = 1;
  paddle = { x: W/2 - 40, y: H - 30, w: 80, h: 12 };
  resetBall();
  createBlocks();
  particles = [];
}

function launchBall() {
  const angle = -Math.PI/2 + (Math.random()*0.6 - 0.3);
  ball.dx = Math.cos(angle) * ball.speed;
  ball.dy = Math.sin(angle) * ball.speed;
  ball.launched = true;
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 4 + 1;
    particles.push({
      x, y,
      dx: Math.cos(a) * s,
      dy: Math.sin(a) * s,
      life: 1,
      color,
      size: Math.random() * 3 + 1
    });
  }
}

function update() {
  if (state !== 'playing') return;

  // Paddle movement
  if (keys['ArrowLeft'] || keys['a']) paddle.x -= 8;
  if (keys['ArrowRight'] || keys['d']) paddle.x += 8;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (!ball.launched) {
    ball.x = paddle.x + paddle.w/2;
    return;
  }

  ball.x += ball.dx;
  ball.y += ball.dy;

  // Wall collisions
  if (ball.x - ball.r <= 0) { ball.x = ball.r; ball.dx = -ball.dx; }
  if (ball.x + ball.r >= W) { ball.x = W - ball.r; ball.dx = -ball.dx; }
  if (ball.y - ball.r <= 0) { ball.y = ball.r; ball.dy = -ball.dy; }

  // Ball lost
  if (ball.y > H) {
    lives--;
    if (lives <= 0) { state = 'gameover'; showOverlay('GAME OVER', `SCORE: ${score}`, 'PRESS SPACE TO RESTART'); }
    else resetBall();
    return;
  }

  // Paddle collision
  if (ball.dy > 0 &&
      ball.y + ball.r >= paddle.y &&
      ball.y + ball.r <= paddle.y + paddle.h + 5 &&
      ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
    const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
    const angle = hit * (Math.PI/3);
    ball.dx = Math.sin(angle) * ball.speed;
    ball.dy = -Math.cos(angle) * ball.speed;
    ball.y = paddle.y - ball.r;
  }

  // Block collisions
  for (let b of blocks) {
    if (!b.alive) continue;
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
        ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {

      b.hp--;
      if (b.hp <= 0) {
        b.alive = false;
        score += 10 * level;
        spawnParticles(ball.x, ball.y, b.color, 8);
      } else {
        score += 5;
      }

      // Determine bounce direction
      const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
      const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
      if (overlapX < overlapY) ball.dx = -ball.dx;
      else ball.dy = -ball.dy;
      break;
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.dx; p.y += p.dy;
    p.life -= 0.02;
    p.dy += 0.1;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Win check
  if (blocks.every(b => !b.alive)) {
    level++;
    if (level > 3) {
      state = 'win';
      showOverlay('YOU WIN!', `FINAL SCORE: ${score}`, 'PRESS SPACE TO PLAY AGAIN');
    } else {
      resetBall();
      createBlocks();
      ball.speed = 5.5 + level * 0.4;
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Grid background
  ctx.strokeStyle = 'rgba(0,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 35) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 35) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Score & Lives
  ctx.font = '16px Courier New';
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#00ffff';
  ctx.fillStyle = '#00ffff';
  ctx.fillText(`SCORE: ${score}`, 15, 25);
  ctx.shadowColor = '#ff00ff';
  ctx.fillStyle = '#ff00ff';
  ctx.fillText(`LIVES: ${'♥'.repeat(lives)}`, W - 120, 25);
  ctx.shadowColor = '#00ff00';
  ctx.fillStyle = '#00ff00';
  ctx.fillText(`LEVEL: ${level}`, W/2 - 30, 25);

  // Paddle
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#00ff00';
  ctx.fillStyle = '#00ff00';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  ctx.shadowBlur = 0;

  // Ball
  if (state === 'playing') {
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ffff00';
    ctx.fillStyle = '#ffff00';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Blocks
  for (let b of blocks) {
    if (!b.alive) continue;
    ctx.shadowBlur = 8;
    ctx.shadowColor = b.color;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    if (b.hp > 1) {
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);
    }
  }
  ctx.shadowBlur = 0;

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 5;
    ctx.shadowColor = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function showOverlay(title, sub, action) {
  overlay.classList.remove('hidden');
  overlay.innerHTML = `<h1>${title}</h1><p>${sub}</p><p class="start">${action}</p>`;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (state === 'menu' || state === 'gameover' || state === 'win') {
      init();
      state = 'playing';
      overlay.classList.add('hidden');
    } else if (state === 'playing' && !ball.launched) {
      launchBall();
    }
  }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('mousemove', e => {
  if (state !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w/2));
});

init();
loop();
</script>
</body>
</html>
